<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Chanflix home dashboard</title>
  <desc id="desc">A dark gruvbox themed media dashboard with a sidebar, search bar, now panel, popular titles, and recent activity.</desc>
  <defs>
    <linearGradient id="posterA" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#b8bb26"/>
      <stop offset="1" stop-color="#458588"/>
    </linearGradient>
    <linearGradient id="posterB" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fabd2f"/>
      <stop offset="1" stop-color="#cc241d"/>
    </linearGradient>
    <linearGradient id="posterC" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#83a598"/>
      <stop offset="1" stop-color="#d3869b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="#1d2021"/>
  <rect x="0" y="0" width="220" height="760" fill="#282828"/>
  <rect x="24" y="26" width="48" height="48" fill="#1d2021" stroke="#b8bb26" stroke-width="4"/>
  <polygon points="40,40 40,60 56,50" fill="#b8bb26"/>
  <rect x="60" y="45" width="7" height="10" fill="#fabd2f"/>
  <text x="86" y="59" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ebdbb2">chanflix</text>

  <g font-family="Arial, sans-serif" font-size="15" font-weight="700">
    <rect x="18" y="116" width="184" height="42" fill="#1d2021"/>
    <text x="48" y="142" fill="#ebdbb2">Discover</text>
    <text x="48" y="194" fill="#a89984">Movies</text>
    <text x="48" y="246" fill="#a89984">Series</text>
    <text x="48" y="298" fill="#a89984">Manage</text>
    <text x="48" y="350" fill="#a89984">Library</text>
    <text x="48" y="402" fill="#a89984">Operations</text>
  </g>

  <rect x="244" y="24" width="910" height="48" fill="#111314" stroke="#3c3836" stroke-width="2"/>
  <circle cx="272" cy="48" r="9" fill="none" stroke="#a89984" stroke-width="3"/>
  <line x1="279" y1="55" x2="286" y2="62" stroke="#a89984" stroke-width="3"/>
  <text x="304" y="55" font-family="Arial, sans-serif" font-size="17" fill="#a89984">Search movies, series, people, and collections</text>

  <text x="244" y="122" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ebdbb2">Tonight</text>
  <rect x="244" y="148" width="552" height="168" fill="#282828" stroke="#504945" stroke-width="2" filter="url(#softShadow)"/>
  <text x="270" y="184" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#b8bb26">NOW STREAMING</text>
  <text x="270" y="218" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#ebdbb2">2 streams active</text>
  <text x="270" y="251" font-family="Arial, sans-serif" font-size="17" fill="#a89984">Family room is watching. Bedroom TV is three episodes deep.</text>
  <rect x="270" y="274" width="138" height="26" fill="#1d2021" stroke="#b8bb26"/>
  <text x="286" y="293" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ebdbb2">Open Operations</text>

  <rect x="820" y="148" width="334" height="168" fill="#282828" stroke="#504945" stroke-width="2"/>
  <text x="846" y="184" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fabd2f">DOWNLOAD QUEUE</text>
  <text x="846" y="218" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#ebdbb2">4 in motion</text>
  <text x="846" y="251" font-family="Arial, sans-serif" font-size="17" fill="#a89984">One grouped season. Two finishing soon.</text>
  <rect x="846" y="274" width="86" height="26" fill="#1d2021" stroke="#fabd2f"/>
  <text x="862" y="293" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ebdbb2">Retry ready</text>

  <text x="244" y="372" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ebdbb2">Popular This Month</text>
  <g transform="translate(244 398)">
    <rect width="132" height="198" fill="url(#posterA)" stroke="#504945" stroke-width="2"/>
    <rect x="14" y="16" width="54" height="24" fill="#458588"/>
    <text x="24" y="34" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ebdbb2">MOVIE</text>
    <text x="16" y="156" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d2021">Signal</text>
    <text x="16" y="178" font-family="Arial, sans-serif" font-size="13" fill="#1d2021">Requested</text>
  </g>
  <g transform="translate(396 398)">
    <rect width="132" height="198" fill="url(#posterB)" stroke="#504945" stroke-width="2"/>
    <rect x="14" y="16" width="54" height="24" fill="#b8bb26"/>
    <text x="24" y="34" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1d2021">MOVIE</text>
    <text x="16" y="156" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d2021">Orbit</text>
    <text x="16" y="178" font-family="Arial, sans-serif" font-size="13" fill="#1d2021">Available</text>
  </g>
  <g transform="translate(548 398)">
    <rect width="132" height="198" fill="url(#posterC)" stroke="#504945" stroke-width="2"/>
    <rect x="14" y="16" width="54" height="24" fill="#cc241d"/>
    <text x="24" y="34" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ebdbb2">SERIES</text>
    <text x="16" y="156" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d2021">Harbor</text>
    <text x="16" y="178" font-family="Arial, sans-serif" font-size="13" fill="#1d2021">Downloading</text>
  </g>
  <g transform="translate(700 398)">
    <rect width="132" height="198" fill="#3c3836" stroke="#504945" stroke-width="2"/>
    <rect x="14" y="16" width="54" height="24" fill="#fabd2f"/>
    <text x="24" y="34" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1d2021">MOVIE</text>
    <text x="16" y="156" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ebdbb2">Midnight</text>
    <text x="16" y="178" font-family="Arial, sans-serif" font-size="13" fill="#a89984">Not downloaded</text>
  </g>

  <rect x="856" y="398" width="298" height="282" fill="#282828" stroke="#504945" stroke-width="2"/>
  <text x="880" y="434" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ebdbb2">Recent Activity</text>
  <g font-family="Arial, sans-serif" font-size="15">
    <circle cx="890" cy="470" r="6" fill="#b8bb26"/>
    <text x="908" y="476" fill="#ebdbb2">A request was approved</text>
    <text x="908" y="498" fill="#a89984">5 min ago</text>
    <circle cx="890" cy="536" r="6" fill="#fabd2f"/>
    <text x="908" y="542" fill="#ebdbb2">Season 2 finished</text>
    <text x="908" y="564" fill="#a89984">22 min ago</text>
    <circle cx="890" cy="602" r="6" fill="#83a598"/>
    <text x="908" y="608" fill="#ebdbb2">Watchlist sync ran</text>
    <text x="908" y="630" fill="#a89984">43 min ago</text>
  </g>
</svg>
